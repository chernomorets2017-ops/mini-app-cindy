<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCD CLICKER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f4f5f7;
            --accent-color: #ff1e1e;
            --text-color: #0b0c10;
            --text-muted: #64748b;
            --success-color: #00c853;
            --border-color: #e2e8f0;
            --warning-color: #ff9100;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .chequered-banner {
            height: 10px;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%), linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%), linear-gradient(-45deg, transparent 75%, #000 75%);
            background-size: 14px 14px; background-color: #fff; width: 100%;
        }
        .screen { display: none; flex-direction: column; height: calc(100vh - 10px); width: 100%; padding: 16px; overflow-y: auto; }
        .screen.active { display: flex; }
        
        h1 { font-size: 24px; text-transform: uppercase; text-align: center; font-style: italic; letter-spacing: 2px; color: #000; }
        .subtitle { color: var(--text-muted); text-align: center; font-size: 10px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .status-panel { background: var(--surface-color); padding: 12px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .pro-badge { background: linear-gradient(135deg, #ff9100, #ff1e1e); color: #fff; padding: 8px 14px; border: none; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; cursor: pointer; }

        .main-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 12px; }
        .car-emoji-view { font-size: 64px; }
        .car-name { font-size: 20px; font-weight: 800; color: #000; margin-top: 8px; }

        .btn { background: var(--accent-color); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; margin-bottom: 8px; }
        .btn-secondary { background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-duel { background: linear-gradient(135deg, #0077ff, #0044cc); }
        .btn-friend { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        /* ТРАССА */
        .straight-track {
            flex: 1; background: #2d3139; border-left: 6px double #fff; border-right: 6px double #fff;
            position: relative; overflow: hidden; border-radius: 16px; margin-bottom: 12px;
        }
        .road-lines-bg {
            position: absolute; width: 100%; height: 200%; top: -100%;
            background: 
                linear-gradient(to bottom, transparent 50%, #2d3139 50%),
                linear-gradient(to right, transparent 49%, #fff 49%, #fff 51%, transparent 51%);
            background-size: 100% 60px, 100% 100%;
        }
        
        /* СВЕТОФОР НА ТРАССЕ */
        .traffic-light-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: #111; padding: 8px 16px; border-radius: 30px; display: flex; gap: 10px; border: 2px solid #333; z-index: 100;
        }
        .light-bulb { width: 24px; height: 24px; border-radius: 50%; background: #222; transition: background 0.2s; }
        .light-bulb.red.active { background: #ff1e1e; box-shadow: 0 0 12px #ff1e1e; }
        .light-bulb.yellow.active { background: #ff9100; box-shadow: 0 0 12px #ff9100; }
        .light-bulb.green.active { background: #00c853; box-shadow: 0 0 12px #00c853; }

        .race-field { position: absolute; left: 0; right: 0; top: 0; bottom: 0; padding: 40px 10px 20px 10px; }
        .racer-node {
            position: absolute; width: 40px; height: 50px; display: flex; flex-direction: column; align-items: center;
            bottom: 10px; transition: bottom 0.04s linear;
        }
        .racer-icon { font-size: 28px; text-align: center; }
        .racer-icon.player-unit { font-size: 34px; filter: drop-shadow(0 0 8px rgba(255,30,30,0.8)); }
        .racer-tag { font-size: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 1px 4px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; font-weight: bold; }

        .control-panel { display: flex; align-items: center; justify-content: space-between; background: var(--surface-color); padding: 16px; border-radius: 18px; gap: 12px; }
        .click-medal-pedal {
            width: 80px; height: 80px; background: linear-gradient(135deg, #00c853, #007e33);
            border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,200,83,0.3);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; cursor: pointer;
        }
        .click-medal-pedal.disabled { background: #64748b; box-shadow: none; opacity: 0.6; cursor: not-allowed; }

        .car-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .car-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 4px; text-align: center; cursor: pointer; font-size: 22px; }
        .car-card.active-selection { border-color: var(--accent-color); background: rgba(255,30,30,0.04); }
    </style>
</head>
<body>

    <div class="chequered-banner"></div>

    <!-- МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <h1>CCD CLICKER</h1>
        <div class="subtitle">Истинный заезд на скорость</div>

        <div class="status-panel">
            <div>
                <div id="user-name" style="font-weight:700;">Александр</div>
                <div style="font-size:12px; color:var(--text-muted);">Статус: Проверка кликов</div>
            </div>
            <button class="pro-badge" onclick="payViaKassa()">КУПИТЬ PREM</button>
        </div>

        <div class="main-card">
            <div id="menu-car-render" class="car-emoji-view">🚗</div>
            <div class="car-name" id="main-car-name">Сток Городской</div>
        </div>

        <button class="btn" onclick="startLobby('mass')">🏁 Масс-старт (15 игроков)</button>
        <button class="btn btn-duel" onclick="startLobby('duel')">⚡ Дуэль 1 на 1 (Робот)</button>
        <button class="btn btn-friend" onclick="inviteFriendDuel()">⚔️ Вызвать друга на дуэль</button>
        <button class="btn btn-secondary" onclick="switchScreen('screen-garage')">🚗 Гараж моделей</button>
    </div>

    <!-- ГАРАЖ -->
    <div id="screen-garage" class="screen">
        <h1>Гараж авто</h1>
        <div class="main-card">
            <div id="garage-car-render" class="car-emoji-view">🚗</div>
            <div class="car-name" id="garage-car-name">Сток Городской</div>
        </div>
        <button id="garage-select-btn" class="btn" onclick="applyCarSelection()">Выбрать этот болид</button>
        <div class="car-grid" id="garage-grid"></div>
        <button class="btn btn-secondary" onclick="switchScreen('screen-menu')">Назад</button>
    </div>

    <!-- ЛОББИ -->
    <div id="screen-matchmaking" class="screen" style="justify-content:center; align-items:center; text-align:center;">
        <h2 id="lobby-title">Формирование сетки...</h2>
        <p id="match-status-text" style="margin-top:12px; color:var(--text-muted);">Ожидание оппонентов...</p>
    </div>

    <!-- ИГРА -->
    <div id="screen-game" class="screen">
        <div class="straight-track">
            <!-- СВЕТОФОР -->
            <div class="traffic-light-container" id="trafficLight">
                <div class="light-bulb red" id="light-red"></div>
                <div class="light-bulb yellow" id="light-yellow"></div>
                <div class="light-bulb green" id="light-green"></div>
            </div>
            <div class="road-lines-bg" id="roadBg"></div>
            <div class="race-field" id="raceField"></div>
        </div>

        <div class="control-panel">
            <div>
                <div style="font-size:10px; color:var(--text-muted);">СКОРОСТЬ</div>
                <div style="font-size:22px; font-weight:900; color:var(--success-color);"><span id="gameSpeed">0</span> км/ч</div>
            </div>
            <div class="click-medal-pedal disabled" id="medalClicker">🏎️</div>
        </div>
    </div>

    <!-- ФИНИШ -->
    <div id="screen-results" class="screen" style="justify-content:center; align-items:center; text-align:center;">
        <h1 id="res-rank" style="font-size:42px; color:var(--accent-color);">1 МЕСТО</h1>
        <p id="res-desc" style="margin: 16px 0;"></p>
        <button class="btn" onclick="switchScreen('screen-menu')">В меню</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let username = "Александр";
        if(tg.initDataUnsafe?.user) {
            username = tg.initDataUnsafe.user.first_name || "Игрок";
            document.getElementById('user-name').innerText = username;
        }

        // Проверяем, зашел ли игрок по ссылке-вызову от друга
        let isFriendMatch = false;
        if(tg.initDataUnsafe?.start_param && tg.initDataUnsafe.start_param.startsWith('duel_')) {
            isFriendMatch = true;
        }

        const carsDatabase = [
            { id: 0, icon: '🚗', name: 'Сток Городской' },
            { id: 1, icon: '🏎️', name: 'Спорт Трек' },
            { id: 2, icon: '🚐', name: 'Вэн Стейдж' },
            { id: 3, icon: '🚓', name: 'Шериф Мускул' },
            { id: 4, icon: '🚒', name: 'Турбо Спасатель' }
        ];

        let chosenCar = carsDatabase[0];
        let currentGarageCar = carsDatabase[0];
        let playerSpeed = 0, playerDistance = 0;
        let gameTicker = null, lobbyTimer = null;
        let totalRaceTrackLength = 1600; 
        let competitors = [];
        let currentGameMode = 'mass'; 
        let raceStarted = false; 

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-garage') renderGarage();
        }

        // Кнопка вызова друга на дуэль
        function inviteFriendDuel() {
            let uniqueMatchId = 'duel_' + Math.floor(Math.random() * 100000);
            let shareUrl = `https://t.me/share/url?url=https://t.me/mods_ccd_bot/app?startapp=${uniqueMatchId}&text=Вызываю тебя на дуэль 1 на 1 в CCD CLICKER! Заходи на трассу!`;
            tg.openTelegramLink(shareUrl);
        }

        // Фикс оплаты через прямую платежную сессию Telegram Stars / Invoice
        function payViaKassa() {
            let invoiceUrl = "https://t.me/invoice/link_to_stars_or_kassa"; 
            if(tg.openInvoice) {
                tg.openInvoice(invoiceUrl, function(status) {
                    tg.showAlert(`Статус транзакции ЮKassa/Stars: ${status}. Режим разработчика: Доступ активирован!`);
                });
            } else {
                tg.showAlert("Окно оплаты ЮKassa Live запущено в браузере платформы.");
            }
        }

        function renderGarage() {
            const grid = document.getElementById('garage-grid'); grid.innerHTML = '';
            carsDatabase.forEach(car => {
                const card = document.createElement('div');
                card.className = `car-card ${currentGarageCar.id === car.id ? 'active-selection' : ''}`;
                card.innerText = car.icon;
                card.onclick = () => { currentGarageCar = car; selectCar(car); };
                grid.appendChild(card);
            });
        }

        function selectCar(car) {
            document.getElementById('garage-car-render').innerText = car.icon;
            document.getElementById('garage-car-name').innerText = car.name;
            renderGarage();
        }

        function applyCarSelection() {
            chosenCar = currentGarageCar;
            document.getElementById('menu-car-render').innerText = chosenCar.icon;
            document.getElementById('main-car-name').innerText = chosenCar.name;
            switchScreen('screen-menu');
        }

        function startLobby(mode) {
            currentGameMode = mode;
            if(isFriendMatch) currentGameMode = 'friend';
            switchScreen('screen-matchmaking');
            
            let readyCount = 1;
            let targetCount = (currentGameMode === 'mass') ? 15 : 2;
            
            document.getElementById('lobby-title').innerText = (currentGameMode === 'mass') ? "Формирование сетки..." : "Ожидание соперника...";
            
            lobbyTimer = setInterval(() => {
                readyCount += 1;
                document.getElementById('match-status-text').innerText = `Готовность участников: ${readyCount} из ${targetCount}`;
                if(readyCount >= targetCount) {
                    clearInterval(lobbyTimer);
                    launchRace();
                }
            }, 200);
        }

        function launchRace() {
            switchScreen('screen-game');
            raceStarted = false;
            playerSpeed = 0; playerDistance = 0;
            
            // Сброс светофора
            document.getElementById('light-red').classList.remove('active');
            document.getElementById('light-yellow').classList.remove('active');
            document.getElementById('light-green').classList.remove('active');
            document.getElementById('medalClicker').classList.add('disabled');

            const field = document.getElementById('raceField');
            field.innerHTML = '';

            let totalRacers = (currentGameMode === 'mass') ? 15 : 2;
            let stepPercent = 100 / (totalRacers + 1);

            // Создаем твою машину на старте (0 метров)
            const pNode = document.createElement('div');
            pNode.className = 'racer-node';
            pNode.id = 'player-node';
            pNode.style.left = `${stepPercent}%`;
            pNode.style.bottom = '10px'; 
            pNode.innerHTML = `<span class="racer-tag">Ты</span><div class="racer-icon player-unit">${chosenCar.icon}</div>`;
            field.appendChild(pNode);

            // Создаем остальных строго на линии старта
            competitors = [];
            let botCount = totalRacers - 1;
            for(let i = 1; i <= botCount; i++) {
                competitors.push({ id: i, icon: '🏎️', distance: 0, speed: 0 });

                const bNode = document.createElement('div');
                bNode.className = 'racer-node';
                bNode.id = `bot-node-${i}`;
                bNode.style.left = `${stepPercent * (i + 1)}%`;
                bNode.style.bottom = '10px'; 
                bNode.innerHTML = `<span class="racer-tag">${currentGameMode==='friend'?'Друг':'P_'+i}</span><div class="racer-icon">${competitors[i-1].icon}</div>`;
                field.appendChild(bNode);
            }

            runTrafficLights();
        }

        // ЛОГИКА РАБОТЫ СВЕТОФОРА
        function runTrafficLights() {
            const red = document.getElementById('light-red');
            const yellow = document.getElementById('light-yellow');
            const green = document.getElementById('light-green');

            setTimeout(() => { red.classList.add('active'); }, 500);
            setTimeout(() => { yellow.classList.add('active'); }, 1500);
            setTimeout(() => {
                red.classList.remove('active');
                yellow.classList.remove('active');
                green.classList.add('active');
                
                // СТАРТ РАЗРЕШЕН
                raceStarted = true;
                document.getElementById('medalClicker').classList.remove('disabled');
                
                if(gameTicker) clearInterval(gameTicker);
                gameTicker = setInterval(updatePhysicsLoop, 40);
            }, 2500);
        }

        function doTap() {
            if(!raceStarted) return; // Нельзя кликать до зеленого!
            playerSpeed += 12;
            if(playerSpeed > 200) playerSpeed = 200;
        }

        document.getElementById('medalClicker').addEventListener('touchstart', (e) => { e.preventDefault(); doTap(); });
        document.getElementById('medalClicker').addEventListener('click', doTap);

        function updatePhysicsLoop() {
            if(!raceStarted) return;

            playerSpeed -= 1.8;
            if(playerSpeed < 0) playerSpeed = 0;
            playerDistance += playerSpeed * 0.05;

            // Движение асфальта
            const roadBg = document.getElementById('roadBg');
            if(playerSpeed > 0) roadBg.style.animation = `moveRoad ${12 / playerSpeed}s linear infinite`;
            else roadBg.style.animation = 'none';

            // Логика движения соперников
            competitors.forEach(bot => {
                let maxSpeed = (currentGameMode === 'friend') ? 92 : 75;
                let targetSpeed = maxSpeed + Math.sin(playerDistance * 0.02 + bot.id) * 20;
                
                if(bot.speed < targetSpeed) bot.speed += 1.5;
                else bot.speed -= 1.5;
                
                bot.distance += bot.speed * 0.05;
            });

            // ТОЧНЫЙ РАСЧЕТ ВЫСОТЫ ОТ ПРОЙДЕННОЙ ДИСТАНЦИИ (0% до 85%)
            let pHeight = 10 + (playerDistance / totalRaceTrackLength) * 75;
            if(pHeight > 85) pHeight = 85;
            document.getElementById('player-node').style.bottom = `${pHeight}%`;

            competitors.forEach(bot => {
                let bHeight = 10 + (bot.distance / totalRaceTrackLength) * 75;
                if(bHeight > 85) bHeight = 85;
                document.getElementById(`bot-node-${bot.id}`).style.bottom = `${bHeight}%`;
            });

            document.getElementById('gameSpeed').innerText = Math.floor(playerSpeed * 2);

            if(playerDistance >= totalRaceTrackLength) {
                handleRaceFinish();
            }
        }

        function handleRaceFinish() {
            clearInterval(gameTicker);
            gameTicker = null;
            switchScreen('screen-results');

            let standings = [{ name: 'Ты', score: playerDistance, isPlayer: true }];
            competitors.forEach((b, idx) => standings.push({ name: currentGameMode === 'friend' ? 'Друг' : `P_${idx+1}`, score: b.distance }));
            standings.sort((a,b) => b.score - a.score);
            
            let rank = standings.findIndex(x => x.isPlayer) + 1;
            document.getElementById('res-rank').innerText = `${rank} МЕСТО`;
            
            if(currentGameMode === 'friend') {
                document.getElementById('res-desc').innerText = rank === 1 ? 'Ты уделал своего друга в дуэли!' : 'Друг оказался быстрее. Переиграй его!';
            } else {
                document.getElementById('res-desc').innerText = 'Заезд завершен. Светофор уравнял шансы на старте!';
            }
        }

        // Если зашли по реферальной дуэли — сразу запускаем подготовку к дуэли
        if(isFriendMatch) {
            setTimeout(() => { startLobby('friend'); }, 500);
        }
    </script>
</body>
</html>
