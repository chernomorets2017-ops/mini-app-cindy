<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCD RACE - NEON EDITION</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --asphalt: #1a1c23;
            --road-line: #f1c40f;
            --neon-red: #ff3366;
            --neon-blue: #00e5ff;
            --neon-green: #39ff14;
            --text-main: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        
        body {
            background-color: var(--asphalt);
            background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .screen { display: none; flex-direction: column; height: 100vh; width: 100%; padding: 20px; overflow-y: auto; }
        .screen.active { display: flex; }
        
        h1 { font-size: 32px; font-weight: 900; font-style: italic; text-align: center; text-transform: uppercase; margin-bottom: 5px; text-shadow: 0 0 10px var(--neon-blue); }
        .subtitle { text-align: center; font-size: 12px; color: #aaa; margin-bottom: 20px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        
        /* КАНАЛ И ПОДПИСКА */
        .sub-banner { background: rgba(255, 51, 102, 0.1); border: 2px dashed var(--neon-red); border-radius: 16px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .sub-banner p { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
        
        /* КНОПКИ */
        .game-btn { background: var(--neon-blue); color: #111; border: none; border-radius: 16px; padding: 18px; font-size: 16px; font-weight: 900; text-transform: uppercase; width: 100%; margin-bottom: 12px; box-shadow: 0 6px 0 #0096a6, 0 10px 20px rgba(0,229,255,0.3); transition: all 0.1s; cursor: pointer; }
        .game-btn:active { transform: translateY(6px); box-shadow: 0 0 0 transparent, 0 5px 10px rgba(0,229,255,0.3); }
        
        .btn-friend { background: var(--road-line); box-shadow: 0 6px 0 #b39100, 0 10px 20px rgba(241,196,15,0.3); }
        .btn-friend:active { box-shadow: 0 0 0 transparent; }
        
        .btn-online { background: var(--neon-red); color: white; box-shadow: 0 6px 0 #b3003b, 0 10px 20px rgba(255,51,102,0.3); }
        .btn-online:active { box-shadow: 0 0 0 transparent; }

        .btn-donate { background: var(--neon-green); color: #111; padding: 10px; font-size: 14px; border-radius: 10px; box-shadow: 0 4px 0 #228b22; margin-top: 10px; }
        .btn-donate:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

        /* ИГРОВОЙ ЭКРАН */
        #screen-game { padding: 0; background: #111; }
        .track { height: 60%; position: relative; background: #222; border-top: 4px solid var(--road-line); border-bottom: 4px solid var(--road-line); overflow: hidden; }
        
        .road-lines { position: absolute; top: 0; left: 0; width: 200%; height: 100%; background-image: linear-gradient(0deg, transparent 48%, rgba(255,255,255,0.1) 48%, rgba(255,255,255,0.1) 52%, transparent 52%); background-size: 100px 100px; }
        .road-lines.moving { animation: roadMove 0.5s linear infinite; }
        @keyframes roadMove { from { transform: translateX(0); } to { transform: translateX(-100px); } }

        .racer { position: absolute; width: 60px; height: 30px; border-radius: 8px; left: 10px; transition: left 0.1s, top 0.3s; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 10px; color: white; }
        .racer.me { background: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); z-index: 10; }
        .racer.bot { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); opacity: 0.8; }
        .racer-name { position: absolute; top: -15px; font-size: 8px; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 4px; border-radius: 4px; }

        .dashboard { height: 40%; background: #0a0a0c; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border-top: 2px solid #333; }
        .stats { display: flex; justify-content: space-between; color: var(--neon-blue); font-size: 24px; font-weight: 900; font-style: italic; }
        
        .pedal-gas { background: linear-gradient(180deg, #ff3366, #b3003b); height: 100px; border-radius: 20px; border: 4px solid #fff; box-shadow: 0 8px 0 #660022; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: white; cursor: pointer; }
        .pedal-gas:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }

        /* МОДАЛКИ И СТАТУСЫ */
        .wallet-panel { background: #2a2d35; padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; margin-bottom: 20px; }
        .coins { color: var(--road-line); font-size: 20px; font-weight: 900; }
    </style>
</head>
<body>

    <!-- АУДИО (Замени src на свои треки) -->
    <audio id="audio-bg" loop src="https://actions.google.com/sounds/v1/science_fiction/scifi_engine_hum.ogg"></audio>
    <audio id="audio-rev" src="https://actions.google.com/sounds/v1/transportation/car_engine_revs.ogg"></audio>
    <audio id="audio-crash" src="https://actions.google.com/sounds/v1/impacts/crash.ogg"></audio>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <h1>CCD RACE</h1>
        <div class="subtitle">Neon Edition 🏎💨</div>

        <!-- 2. ПРОВЕРКА ПОДПИСКИ -->
        <div class="sub-banner" id="sub-banner">
            <p>Доступ к мультиплееру закрыт!</p>
            <button class="game-btn btn-online" style="padding: 10px; font-size: 14px;" onclick="checkSub()">Подписаться на @mods_ccd</button>
        </div>

        <!-- 6. КОШЕЛЕК И ЮKASSA -->
        <div class="wallet-panel">
            <div>
                <div style="font-size: 10px; color: #aaa; text-transform: uppercase;">Твой гараж</div>
                <div class="coins">💰 <span id="balance">0</span> CCD</div>
            </div>
            <button class="game-btn btn-donate" onclick="buyCoinsYookassa()">Купить за ₽</button>
        </div>

        <!-- РЕЖИМЫ ИГРЫ -->
        <button class="game-btn" onclick="startBotMode()">🤖 Заезд с ботами</button>
        <button class="game-btn btn-friend" onclick="openFriendRoom()">👥 Игра с другом</button>
        <button class="game-btn btn-online" onclick="openOnlineLobby()">🌍 Онлайн (10 чел)</button>
    </div>

    <!-- ЛОББИ (ДЛЯ ОНЛАЙНА И ДРУЗЕЙ) -->
    <div id="screen-lobby" class="screen">
        <h1 id="lobby-title">Комната</h1>
        <div class="subtitle" id="lobby-status">Ожидание игроков...</div>
        
        <div style="background: #2a2d35; border-radius: 16px; padding: 15px; margin-bottom: 20px; flex-grow: 1;">
            <h3 style="margin-bottom: 15px; color: var(--neon-blue);">Игроки (<span id="player-count">1</span>/10)</h3>
            <div id="players-list" style="font-size: 14px; line-height: 2;">
                <div>🟢 Ты (Хост)</div>
            </div>
        </div>

        <button class="game-btn btn-friend" id="invite-btn" onclick="shareToFriend()">🔗 Отправить ссылку другу</button>
        <button class="game-btn" onclick="startRaceUI()">🏁 НАЧАТЬ ГОНКУ</button>
        <button class="game-btn btn-online" onclick="showScreen('screen-menu')">Назад</button>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="screen-game" class="screen">
        <div class="track" id="track">
            <div class="road-lines" id="road-lines"></div>
            <!-- Машины будут спавниться здесь через JS -->
        </div>

        <div class="dashboard">
            <div class="stats">
                <div>KM/H: <span id="ui-speed" style="color: white;">0</span></div>
                <div style="color: var(--neon-green);">Метров: <span id="ui-dist">0</span></div>
            </div>
            <!-- ОГРОМНАЯ ПЕДАЛЬ ГАЗА (ДЛЯ ДЕТЕЙ И ВЗРОСЛЫХ) -->
            <div class="pedal-gas" id="gas-pedal">GAS</div>
        </div>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div id="screen-result" class="screen" style="justify-content: center; align-items: center; text-align: center;">
        <h1 style="font-size: 40px; color: var(--neon-green);" id="res-title">ФИНИШ!</h1>
        <p class="subtitle" id="res-desc" style="font-size: 16px; margin: 20px 0;">Ты проехал 0 метров</p>
        <button class="game-btn" onclick="showScreen('screen-menu')">В ГАРАЖ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isSubscribed = false;
        let balance = 0;

        // --- УТИЛИТЫ UI ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            if(id !== 'screen-game') stopAudio();
        }

        // --- 2. ПОДПИСКА ---
        function checkSub() {
            // В реальности тут запрос к твоему Python-боту.
            tg.openTelegramLink('https://t.me/mods_ccd');
            setTimeout(() => {
                isSubscribed = true;
                document.getElementById('sub-banner').style.display = 'none';
                tg.showAlert('Красава! Мультиплеер разблокирован.');
            }, 2000);
        }

        // --- 6. ЮKASSA (Эмуляция фронтенда для вызова инвойса) ---
        function buyCoinsYookassa() {
            // В TMA оплата работает так: бот генерирует ссылку на инвойс, а фронтенд её открывает.
            // Ты должен сделать в боте команду, которая вернет ссылку, и подставить её сюда:
            // tg.openInvoice('ССЫЛКА_ОТ_БОТА', function(status) { ... });
            
            tg.showConfirm('Тестовый вызов ЮKassa (Токен 390540012:LIVE:100292). Перекинуть на оплату?', (res) => {
                if(res) {
                    balance += 500;
                    document.getElementById('balance').innerText = balance;
                    tg.showAlert('Оплата прошла! +500 CCD');
                }
            });
        }

        // --- 3 & 4. МУЛЬТИПЛЕЕР (Интерфейс) ---
        function openFriendRoom() {
            if(!isSubscribed) return tg.showAlert('Сначала подпишись на канал!');
            document.getElementById('lobby-title').innerText = "Игра с другом";
            document.getElementById('invite-btn').style.display = "block";
            showScreen('screen-lobby');
        }

        function openOnlineLobby() {
            if(!isSubscribed) return tg.showAlert('Сначала подпишись на канал!');
            document.getElementById('lobby-title').innerText = "Глобальный заезд (10 чел)";
            document.getElementById('invite-btn').style.display = "none";
            document.getElementById('player-count').innerText = "8"; // Симуляция онлайна
            
            let list = document.getElementById('players-list');
            list.innerHTML = '<div>🟢 Ты</div><div>🔴 Гоша (Готов)</div><div>🔴 Vova_Race (Готов)</div><div>🔴 Sanek99 (Готов)</div><div>...еще 4 игрока</div>';
            showScreen('screen-lobby');
        }

        function shareToFriend() {
            tg.openTelegramLink(`https://t.me/share/url?url=https://t.me/mods_ccd_bot/app?startapp=room&text=Залетай ко мне в лобби!`);
        }

        // --- 5. ЛОГИКА ИГРЫ И ЗЛЫЕ БОТЫ ---
        let gameLoop;
        let myCar = { speed: 0, distance: 0, el: null };
        let bots = [];
        let raceActive = false;

        class RacingBot {
            constructor(id, name, difficulty, yPos) {
                this.name = name;
                this.difficulty = difficulty; // 0.0 до 1.0
                this.speed = 0;
                this.distance = 0;
                
                this.el = document.createElement('div');
                this.el.className = 'racer bot';
                this.el.style.top = yPos + '%';
                this.el.innerHTML = `<div class="racer-name">${name}</div>BOT`;
                document.getElementById('track').appendChild(this.el);
            }

            update(playerDist) {
                // Базовое ускорение бота
                this.speed += (Math.random() * 4) * this.difficulty;
                
                // ИИ ошибки: "злой", но иногда тупит
                const mistakeChance = 0.03 * (1.5 - this.difficulty);
                if (Math.random() < mistakeChance) {
                    this.speed *= 0.6; // Резко потерял скорость (занос)
                    if(Math.random() > 0.8) playSound('audio-crash');
                }

                // Rubber-banding: если сильно отстал - читерит
                if (playerDist - this.distance > 300) this.speed += 10;
                
                // Трение
                this.speed -= 1.5;
                if(this.speed < 0) this.speed = 0;
                if(this.speed > 220) this.speed = 220;

                this.distance += this.speed * 0.1;
            }
        }

        function startBotMode() {
            document.getElementById('lobby-title').innerText = "Одиночный режим";
            document.getElementById('invite-btn').style.display = "none";
            document.getElementById('player-count').innerText = "4";
            document.getElementById('players-list').innerHTML = '<div>🟢 Ты</div><div>🤖 Злой Бот 1</div><div>🤖 Бот Новичок</div><div>🤖 Турбо Бот</div>';
            showScreen('screen-lobby');
        }

        function startRaceUI() {
            showScreen('screen-game');
            initRace();
        }

        function initRace() {
            const track = document.getElementById('track');
            track.innerHTML = '<div class="road-lines moving" id="road-lines"></div>';
            
            // Спавн игрока
            myCar = { speed: 0, distance: 0, el: document.createElement('div') };
            myCar.el.className = 'racer me';
            myCar.el.style.top = '20%';
            myCar.el.innerHTML = '<div class="racer-name">ТЫ</div>AUTO';
            track.appendChild(myCar.el);

            // Спавн ботов (с разной сложностью)
            bots = [
                new RacingBot(1, 'Злой Бот', 0.9, 40),
                new RacingBot(2, 'Средний Бот', 0.6, 60),
                new RacingBot(3, 'Тупой Бот', 0.3, 80)
            ];

            raceActive = true;
            playSound('audio-bg');
            
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(updatePhysics, 50);

            // Остановка через 15 секунд (таймер гонки)
            setTimeout(endRace, 15000);
        }

        // КЛИК ПО ПЕДАЛИ ГАЗА
        document.getElementById('gas-pedal').addEventListener('touchstart', (e) => { e.preventDefault(); pressGas(); });
        document.getElementById('gas-pedal').addEventListener('mousedown', pressGas);

        function pressGas() {
            if(!raceActive) return;
            myCar.speed += 25;
            if(myCar.speed > 250) myCar.speed = 250;
            
            let rev = document.getElementById('audio-rev');
            rev.currentTime = 0; rev.play();
        }

        function updatePhysics() {
            if(!raceActive) return;

            // Трение игрока
            myCar.speed -= 2;
            if(myCar.speed < 0) myCar.speed = 0;
            myCar.distance += myCar.speed * 0.1;

            // Обновляем UI
            document.getElementById('ui-speed').innerText = Math.floor(myCar.speed);
            document.getElementById('ui-dist').innerText = Math.floor(myCar.distance);
            
            // Двигаем ботов
            bots.forEach(bot => bot.update(myCar.distance));

            // Рендер на экране (относительно игрока)
            bots.forEach(bot => {
                let relativeX = 10 + (bot.distance - myCar.distance) * 0.5;
                // Ограничиваем вылет за экран
                if(relativeX < -100) relativeX = -100;
                if(relativeX > window.innerWidth) relativeX = window.innerWidth;
                bot.el.style.left = relativeX + 'px';
            });
        }

        function endRace() {
            raceActive = false;
            clearInterval(gameLoop);
            document.getElementById('road-lines').classList.remove('moving');
            
            let place = 1;
            bots.forEach(b => { if(b.distance > myCar.distance) place++; });

            document.getElementById('res-title').innerText = place === 1 ? "ТЫ ВЫИГРАЛ!" : `МЕСТО: ${place}`;
            document.getElementById('res-desc').innerText = `Дистанция: ${Math.floor(myCar.distance)} м.\nЗаработано: +${100/place} CCD`;
            
            balance += Math.floor(100/place);
            document.getElementById('balance').innerText = balance;

            showScreen('screen-result');
        }

        // --- 7. МУЗЫКА И ЗВУКИ ---
        function playSound(id) {
            try { document.getElementById(id).play(); } catch(e) {}
        }
        function stopAudio() {
            try {
                let bg = document.getElementById('audio-bg');
                bg.pause(); bg.currentTime = 0;
            } catch(e) {}
        }
    </script>
</body>
</html>
