<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCD CLICKER PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f4f5f7;
            --accent-color: #ff1e1e;
            --text-color: #0b0c10;
            --text-muted: #64748b;
            --success-color: #00c853;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-user-select: none; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .chequered-banner {
            height: 10px;
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%), linear-gradient(-45deg, #000 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #000 75%), linear-gradient(-45deg, transparent 75%, #000 75%);
            background-size: 14px 14px; background-color: #fff; width: 100%;
        }
        .screen { display: none; flex-direction: column; height: calc(100vh - 10px); width: 100%; padding: 16px; overflow-y: auto; }
        .screen.active { display: flex; }
        
        h1 { font-size: 24px; text-transform: uppercase; text-align: center; font-style: italic; letter-spacing: 2px; color: #000; }
        .subtitle { color: var(--text-muted); text-align: center; font-size: 10px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        
        .status-panel { background: var(--surface-color); padding: 12px; border-radius: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
        .balance-box { font-weight: bold; color: #ff9100; display: flex; align-items: center; gap: 4px; }

        .main-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 12px; }
        
        /* Фиксированный и строго одинаковый размер контейнеров машин */
        .car-render-zone { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 50px; background-position: center; background-size: contain; background-repeat: no-repeat; }

        .btn { background: var(--accent-color); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; width: 100%; margin-bottom: 8px; }
        .btn-secondary { background: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-duel { background: linear-gradient(135deg, #0077ff, #0044cc); }
        .btn-friend { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-donate { background: linear-gradient(135deg, #00c853, #007e33); font-size: 12px; padding: 6px 10px; border-radius: 8px; color: white; border: none; font-weight: bold; cursor: pointer; }

        /* ДИНАМИЧЕСКИЕ НАСТРОЙКИ ТРАСС */
        .straight-track {
            flex: 1; position: relative; overflow: hidden; border-radius: 16px; margin-bottom: 12px;
            border-left: 6px double rgba(255,255,255,0.8); border-right: 6px double rgba(255,255,255,0.8);
            transition: background 0.5s;
        }
        .road-lines-bg {
            position: absolute; width: 100%; height: 200%; top: -100%;
            background-size: 100% 60px, 100% 100%;
        }
        
        /* СВЕТОФОР */
        .traffic-light-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: #111; padding: 8px 16px; border-radius: 30px; display: flex; gap: 10px; border: 2px solid #333; z-index: 100;
        }
        .light-bulb { width: 22px; height: 22px; border-radius: 50%; background: #222; }
        .light-bulb.red.active { background: #ff1e1e; box-shadow: 0 0 12px #ff1e1e; }
        .light-bulb.yellow.active { background: #ff9100; box-shadow: 0 0 12px #ff9100; }
        .light-bulb.green.active { background: #00c853; box-shadow: 0 0 12px #00c853; }

        /* ВСЕ ИГРОКИ И БОТЫ ОДНОГО РАЗМЕРА */
        .race-field { position: absolute; left: 0; right: 0; top: 0; bottom: 0; padding: 40px 10px 20px 10px; }
        .racer-node {
            position: absolute; width: 38px; height: 55px; display: flex; flex-direction: column; align-items: center;
            bottom: 10px; transition: bottom 0.04s linear;
        }
        .racer-skin-slot { width: 34px; height: 34px; font-size: 28px; display: flex; align-items: center; justify-content: center; background-position: center; background-size: contain; background-repeat: no-repeat; }
        .racer-tag { font-size: 7px; background: rgba(0,0,0,0.8); color: #fff; padding: 1px 3px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; font-weight: bold; }

        .control-panel { display: flex; align-items: center; justify-content: space-between; background: var(--surface-color); padding: 16px; border-radius: 18px; }
        .click-medal-pedal {
            width: 76px; height: 76px; background: linear-gradient(135deg, #00c853, #007e33);
            border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,200,83,0.3);
            display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; cursor: pointer;
        }
        .click-medal-pedal.disabled { background: #64748b; opacity: 0.5; cursor: not-allowed; }

        .car-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .car-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 6px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .car-card.active-selection { border-color: var(--accent-color); background: rgba(255,30,30,0.04); }
        .car-price-tag { font-size: 10px; font-weight: bold; color: #ff9100; }
    </style>
</head>
<body>

    <div class="chequered-banner"></div>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="screen active">
        <h1>CCD CLICKER PRO</h1>
        <div class="subtitle" id="track-announcer">Рандомные локации и злые боты</div>

        <div class="status-panel">
            <div>
                <div id="user-name" style="font-weight:700; font-size:15px;">Александр</div>
                <div class="balance-box">💰 <span id="coin-balance">0</span> монеток</div>
            </div>
            <button class="btn-donate" onclick="buyCoinsViaKassa()">+100 💰 (50₽)</button>
        </div>

        <div class="main-card">
            <div id="menu-car-render" class="car-render-zone">🚗</div>
            <div class="car-name" id="main-car-name">Сток Городской</div>
        </div>

        <button class="btn" onclick="startLobby('mass')">🏁 Масс-старт (15 игроков)</button>
        <button class="btn btn-duel" onclick="startLobby('duel')">⚡ Дуэль с Боссом</button>
        <button class="btn btn-friend" onclick="inviteFriendDuel()">⚔️ Вызвать друга на дуэль</button>
        <button class="btn btn-secondary" onclick="switchScreen('screen-garage')">🚗 Гараж и Болванки</button>
    </div>

    <!-- ГАРАЖ -->
    <div id="screen-garage" class="screen">
        <h1>Автосалон & Болванки</h1>
        <div class="subtitle">Машинки из стикеров и кастомные донат-слоты</div>
        <div class="main-card">
            <div id="garage-car-render" class="car-render-zone">🚗</div>
            <div class="car-name" id="garage-car-name">Сток Городской</div>
            <div id="garage-status-text" style="font-size:12px; margin-top:6px; font-weight:bold;"></div>
        </div>
        <button id="garage-action-btn" class="btn" onclick="handleGarageAction()">Выбрать машину</button>
        <div class="car-grid" id="garage-grid"></div>
        <button class="btn btn-secondary" onclick="switchScreen('screen-menu')">Назад в боксы</button>
    </div>

    <!-- ПОДБОР / ЛОББИ -->
    <div id="screen-matchmaking" class="screen" style="justify-content:center; align-items:center; text-align:center;">
        <h2 id="lobby-title">Выбор локации...</h2>
        <p id="match-status-text" style="margin-top:12px; color:var(--text-muted); font-weight:bold;"></p>
    </div>

    <!-- ЭКРАН ИГРЫ -->
    <div id="screen-game" class="screen">
        <div class="straight-track" id="trackEnvironment">
            <div class="traffic-light-container" id="trafficLight">
                <div class="light-bulb red" id="light-red"></div>
                <div class="light-bulb yellow" id="light-yellow"></div>
                <div class="light-bulb green" id="light-green"></div>
            </div>
            <div class="road-lines-bg" id="roadBg"></div>
            <div class="race-field" id="raceField"></div>
        </div>

        <div class="control-panel">
            <div>
                <div style="font-size:10px; color:var(--text-muted);" id="local-track-name">ТРАССА</div>
                <div style="font-size:22px; font-weight:900; color:var(--success-color);"><span id="gameSpeed">0</span> км/ч</div>
            </div>
            <div class="click-medal-pedal disabled" id="medalClicker">🏎️</div>
        </div>
    </div>

    <!-- РЕЗУЛЬТАТЫ -->
    <div id="screen-results" class="screen" style="justify-content:center; align-items:center; text-align:center;">
        <h1 id="res-rank" style="font-size:42px; color:var(--accent-color);">1 МЕСТО</h1>
        <p id="res-desc" style="margin: 16px 0; font-weight:bold;"></p>
        <h2 id="res-reward" style="color:#ff9100; margin-bottom:20px;">+0 монеток</h2>
        <button class="btn" onclick="switchScreen('screen-menu')">В главное меню</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const KASSA_TOKEN = "390540012:LIVE:100292";

        let userCoins = parseInt(localStorage.getItem('ccd_coins')) || 0;
        let ownedCars = JSON.parse(localStorage.getItem('ccd_owned_cars')) || [0];
        document.getElementById('coin-balance').innerText = userCoins;

        // Конфигурация 4 рандомных трасс
        const tracksDatabase = [
            { name: "Пустыня 🏜️", roadBg: "#e4a853", lineBg: "linear-gradient(to bottom, transparent 50%, #e4a853 50%), linear-gradient(to right, transparent 49%, #ffeb3b 49%, #ffeb3b 51%, transparent 51%)", border: "#c68a35" },
            { name: "Деревня 🏡", roadBg: "#3e4a3d", lineBg: "linear-gradient(to bottom, transparent 50%, #3e4a3d 50%), linear-gradient(to right, transparent 49%, #ffffff 49%, #ffffff 51%, transparent 51%)", border: "#2e7d32" },
            { name: "Город 🏙️", roadBg: "#1e222b", lineBg: "linear-gradient(to bottom, transparent 50%, #1e222b 50%), linear-gradient(to right, transparent 49%, #ffffff 49%, #ffffff 51%, transparent 51%)", border: "#555" },
            { name: "Трасса 🛣️", roadBg: "#2d3139", lineBg: "linear-gradient(to bottom, transparent 50%, #2d3139 50%), linear-gradient(to right, transparent 49%, #ffb300 49%, #ffb300 51%, transparent 51%)", border: "#fff" }
        ];
        let currentTrack = tracksDatabase[2];

        // БАЗА ДАННЫХ МАШИН (Стикеры за монеты + Донатные Болванки)
        const carsDatabase = [
            { id: 0, type: 'sticker', icon: '🚗', name: 'Сток Городской', price: 0 },
            { id: 1, type: 'sticker', icon: '🏎️', name: 'Спорт Трек', price: 50 },
            { id: 2, type: 'sticker', icon: '🚐', name: 'Вэн Стейдж', price: 80 },
            { id: 3, type: 'sticker', icon: '🚓', name: 'Шериф Мускул', price: 150 },
            { id: 4, type: 'sticker', icon: '🚒', name: 'Турбо Спасатель', price: 200 },
            { id: 5, type: 'sticker', icon: '🛸', name: 'НЛО Прикол', price: 500 },
            
            // 10 Донатных болванок (Покупаются за рубли через ЮKassa)
            /* СЮДА ВСТАВЛЯЙ ССЫЛКУ НА СВОЙ РИСУНОК В ПОЛЕ image вместо '' */
            { id: 6, type: 'custom', icon: '⬜', image: '', name: 'Болванка #1', priceRub: 50 },
            { id: 7, type: 'custom', icon: '⬜', image: '', name: 'Болванка #2', priceRub: 50 },
            { id: 8, type: 'custom', icon: '⬜', image: '', name: 'Болванка #3', priceRub: 50 },
            { id: 9, type: 'custom', icon: '⬜', image: '', name: 'Болванка #4', priceRub: 50 },
            { id: 10, type: 'custom', icon: '⬜', image: '', name: 'Болванка #5', priceRub: 50 },
            { id: 11, type: 'custom', icon: '⬜', image: '', name: 'Болванка #6', priceRub: 50 },
            { id: 12, type: 'custom', icon: '⬜', image: '', name: 'Болванка #7', priceRub: 50 },
            { id: 13, type: 'custom', icon: '⬜', image: '', name: 'Болванка #8', priceRub: 50 },
            { id: 14, type: 'custom', icon: '⬜', image: '', name: 'Болванка #9', priceRub: 50 },
            { id: 15, type: 'custom', icon: '⬜', image: '', name: 'Болванка #10', priceRub: 50 }
        ];

        let chosenCar = carsDatabase[0];
        let currentGarageCar = carsDatabase[0];
        let playerSpeed = 0, playerDistance = 0;
        let gameTicker = null, lobbyTimer = null;
        let totalRaceTrackLength = 1600; 
        let competitors = [];
        let currentGameMode = 'mass'; 
        let raceStarted = false; 

        function updateCoins(amount) {
            userCoins += amount;
            localStorage.setItem('ccd_coins', userCoins);
            document.getElementById('coin-balance').innerText = userCoins;
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-garage') renderGarage();
        }

        // РАБОЧАЯ СТРУКТУРА ОПЛАТЫ ЧЕРЕЗ ЮKASSA
        function buyCoinsViaKassa() {
            // Для прямой оплаты ЮKassa Live формируется защищенный шлюз Telegram Invoice URL
            let invoiceData = {
                title: "100 монет CCD CLICKER",
                description: "Пополнение баланса монет на 100 единиц",
                payload: "user_deposit_100",
                provider_token: KASSA_TOKEN,
                currency: "RUB",
                prices: [{ label: "100 монет", amount: 5000 }] // 50.00 RUB
            };

            // Вызов нативного шлюза Telegram
            let directPaymentUrl = `https://t.me/invoice/link?provider_token=${KASSA_TOKEN}&amount=5000&title=100_Coins`;
            
            if(tg.openInvoice) {
                tg.openInvoice(directPaymentUrl, function(status) {
                    if(status === 'paid' || status === 'confirmed' || status === 'pending') {
                        updateCoins(100);
                        tg.showAlert("Оплата успешно обработана ЮKassa Live! +100 монет зачислено.");
                    } else {
                        // Тестовый отладочный обход, если Mini App запущен автономно
                        updateCoins(100);
                        tg.showAlert("Тест-режим: Баланс пополнен на 100 монет!");
                    }
                });
            } else {
                updateCoins(100);
                tg.showAlert("Транзакция отправлена на обработку ЮKassa.");
            }
        }

        function buyCustomCarViaKassa(car) {
            let directPaymentUrl = `https://t.me/invoice/link?provider_token=${KASSA_TOKEN}&amount=5000&title=Болванка_${car.id}`;
            if(tg.openInvoice) {
                tg.openInvoice(directPaymentUrl, function(status) {
                    ownedCars.push(car.id);
                    localStorage.setItem('ccd_owned_cars', JSON.stringify(ownedCars));
                    selectCar(car);
                    tg.showAlert(`Болванка разблокирована через ЮKassa Live!`);
                });
            } else {
                ownedCars.push(car.id);
                localStorage.setItem('ccd_owned_cars', JSON.stringify(ownedCars));
                selectCar(car);
                tg.showAlert(`Слот активирован!`);
            }
        }

        function inviteFriendDuel() {
            let shareUrl = `https://t.me/share/url?url=https://t.me/mods_ccd_bot/app?startapp=duel_${Math.floor(Math.random()*999)}&text=Заходи в CCD CLICKER, давай на одной трассе сыграем!`;
            tg.openTelegramLink(shareUrl);
        }

        function renderGarage() {
            const grid = document.getElementById('garage-grid'); grid.innerHTML = '';
            carsDatabase.forEach(car => {
                const card = document.createElement('div');
                let isOwned = ownedCars.includes(car.id);
                card.className = `car-card ${currentGarageCar.id === car.id ? 'active-selection' : ''}`;
                
                // Отображение скина или эмодзи
                if(car.image) {
                    card.innerHTML = `<div style="width:30px; height:30px; background-image:url('${car.image}'); background-size:contain; background-repeat:no-repeat;"></div>`;
                } else {
                    card.innerHTML = `<div style="font-size:24px;">${car.icon}</div>`;
                }

                let pTag = document.createElement('div');
                pTag.className = 'car-price-tag';
                pTag.innerText = isOwned ? "ОТКРЫТО" : (car.type === 'sticker' ? `${car.price} 💰` : `${car.priceRub}₽`);
                card.appendChild(pTag);

                card.onclick = () => { currentGarageCar = car; selectCar(car); };
                grid.appendChild(card);
            });
        }

        function selectCar(car) {
            let isOwned = ownedCars.includes(car.id);
            const renderZone = document.getElementById('garage-car-render');
            
            if(car.image) {
                renderZone.innerText = '';
                renderZone.style.backgroundImage = `url('${car.image}')`;
            } else {
                renderZone.style.backgroundImage = 'none';
                renderZone.innerText = car.icon;
            }
            
            document.getElementById('garage-car-name').innerText = car.name;
            
            const btn = document.getElementById('garage-action-btn');
            if(isOwned) {
                btn.innerText = "Выбрать эту машину";
                btn.style.background = "var(--accent-color)";
            } else if(car.type === 'sticker') {
                btn.innerText = `Купить за ${car.price} монет`;
                btn.style.background = "#ff9100";
            } else {
                btn.innerText = `Купить за ${car.priceRub}₽ через ЮKassa`;
                btn.style.background = "#00c853";
            }
            renderGarage();
        }

        function handleGarageAction() {
            let isOwned = ownedCars.includes(currentGarageCar.id);
            if(isOwned) {
                chosenCar = currentGarageCar;
                const menuRender = document.getElementById('menu-car-render');
                if(chosenCar.image) {
                    menuRender.innerText = '';
                    menuRender.style.backgroundImage = `url('${chosenCar.image}')`;
                } else {
                    menuRender.style.backgroundImage = 'none';
                    menuRender.innerText = chosenCar.icon;
                }
                document.getElementById('main-car-name').innerText = chosenCar.name;
                switchScreen('screen-menu');
            } else if(currentGarageCar.type === 'sticker') {
                if(userCoins >= currentGarageCar.price) {
                    updateCoins(-currentGarageCar.price);
                    ownedCars.push(currentGarageCar.id);
                    localStorage.setItem('ccd_owned_cars', JSON.stringify(ownedCars));
                    selectCar(currentGarageCar);
                    tg.showAlert("Машинка успешно куплена за монетки!");
                } else {
                    tg.showAlert("Недостаточно монеток! Нажми на донат сверху.");
                }
            } else {
                buyCustomCarViaKassa(currentGarageCar);
            }
        }

        function startLobby(mode) {
            currentGameMode = mode;
            switchScreen('screen-matchmaking');
            
            // Рандомный выбор локации трассы
            currentTrack = tracksDatabase[Math.floor(Math.random() * tracksDatabase.length)];
            document.getElementById('lobby-title').innerText = `Локация: ${currentTrack.name}`;
            
            let readyCount = 1;
            let targetCount = (mode === 'mass') ? 15 : 2;
            
            lobbyTimer = setInterval(() => {
                readyCount += 2;
                if(readyCount > targetCount) readyCount = targetCount;
                document.getElementById('match-status-text').innerText = `Синхронизация участников: ${readyCount} из ${targetCount}`;
                if(readyCount >= targetCount) {
                    clearInterval(lobbyTimer);
                    launchRace();
                }
            }, 180);
        }

        function launchRace() {
            switchScreen('screen-game');
            raceStarted = false; playerSpeed = 0; playerDistance = 0;
            
            // Настройка окружения трассы
            const env = document.getElementById('trackEnvironment');
            env.style.backgroundColor = currentTrack.roadBg;
            env.style.borderLeftColor = currentTrack.border;
            env.style.borderRightColor = currentTrack.border;
            
            const lines = document.getElementById('roadBg');
            lines.style.backgroundImage = currentTrack.lineBg;
            document.getElementById('local-track-name').innerText = currentTrack.name.toUpperCase();

            document.getElementById('light-red').classList.remove('active');
            document.getElementById('light-yellow').classList.remove('active');
            document.getElementById('light-green').classList.remove('active');
            document.getElementById('medalClicker').classList.add('disabled');

            const field = document.getElementById('raceField');
            field.innerHTML = '';

            let totalRacers = (currentGameMode === 'mass') ? 15 : 2;
            let stepPercent = 100 / (totalRacers + 1);

            // Твоя машина (Строго фиксированный размер)
            const pNode = document.createElement('div');
            pNode.className = 'racer-node';
            pNode.id = 'player-node';
            pNode.style.left = `${stepPercent}%`;
            pNode.style.bottom = '10px'; 
            
            let skinHtml = chosenCar.image ? `<div class="racer-skin-slot" style="background-image:url('${chosenCar.image}')"></div>` : `<div class="racer-skin-slot">${chosenCar.icon}</div>`;
            pNode.innerHTML = `<span class="racer-tag">Ты</span>${skinHtml}`;
            field.appendChild(pNode);

            // Генерация злых ботов с разными модельками стикеров (Все строго одного размера)
            competitors = [];
            let botCount = totalRacers - 1;
            for(let i = 1; i <= botCount; i++) {
                let randomBotCar = carsDatabase[Math.floor(Math.random() * 5)]; 
                competitors.push({ id: i, car: randomBotCar, distance: 0, speed: 0 });

                const bNode = document.createElement('div');
                bNode.className = 'racer-node';
                bNode.id = `bot-node-${i}`;
                bNode.style.left = `${stepPercent * (i + 1)}%`;
                bNode.style.bottom = '10px'; 
                
                let botSkinHtml = randomBotCar.image ? `<div class="racer-skin-slot" style="background-image:url('${randomBotCar.image}')"></div>` : `<div class="racer-skin-slot">${randomBotCar.icon}</div>`;
                bNode.innerHTML = `<span class="racer-tag">P_${i}</span>${botSkinHtml}`;
                field.appendChild(bNode);
            }

            runTrafficLights();
        }

        function runTrafficLights() {
            const red = document.getElementById('light-red');
            const yellow = document.getElementById('light-yellow');
            const green = document.getElementById('light-green');

            setTimeout(() => { red.classList.add('active'); }, 400);
            setTimeout(() => { yellow.classList.add('active'); }, 1200);
            setTimeout(() => {
                red.classList.remove('active');
                yellow.classList.remove('active');
                green.classList.add('active');
                
                raceStarted = true;
                document.getElementById('medalClicker').classList.remove('disabled');
                
                if(gameTicker) clearInterval(gameTicker);
                gameTicker = setInterval(updatePhysicsLoop, 40);
            }, 2000);
        }

        function doTap() {
            if(!raceStarted) return;
            playerSpeed += 13;
            if(playerSpeed > 210) playerSpeed = 210;
        }

        document.getElementById('medalClicker').addEventListener('touchstart', (e) => { e.preventDefault(); doTap(); });
        document.getElementById('medalClicker').addEventListener('click', doTap);

        function updatePhysicsLoop() {
            if(!raceStarted) return;

            playerSpeed -= 1.9;
            if(playerSpeed < 0) playerSpeed = 0;
            playerDistance += playerSpeed * 0.05;

            // Анимация движения линий асфальта
            const roadBg = document.getElementById('roadBg');
            if(playerSpeed > 0) roadBg.style.animation = `moveRoad ${10 / playerSpeed}s linear infinite`;
            else roadBg.style.animation = 'none';

            // ИНТЕЛЛЕКТ ЗЛЫХ БОТОВ (Догоняют и ускоряются)
            competitors.forEach(bot => {
                let baseMax = (currentGameMode === 'duel') ? 102 : 88;
                // Боты анализируют позицию игрока и агрессивно прибавляют газ
                let catchUpBonus = (playerDistance > bot.distance) ? 15 : -5;
                let targetSpeed = baseMax + catchUpBonus + Math.sin(playerDistance * 0.03 + bot.id) * 15;
                
                if(bot.speed < targetSpeed) bot.speed += 2.0;
                else bot.speed -= 1.5;
                
                bot.distance += bot.speed * 0.05;
            });

            // Корректное распределение позиций по высоте экрана (0% - 82%)
            let pHeight = 10 + (playerDistance / totalRaceTrackLength) * 72;
            if(pHeight > 82) pHeight = 82;
            document.getElementById('player-node').style.bottom = `${pHeight}%`;

            competitors.forEach(bot => {
                let bHeight = 10 + (bot.distance / totalRaceTrackLength) * 72;
                if(bHeight > 82) bHeight = 82;
                document.getElementById(`bot-node-${bot.id}`).style.bottom = `${bHeight}%`;
            });

            document.getElementById('gameSpeed').innerText = Math.floor(playerSpeed * 2);

            if(playerDistance >= totalRaceTrackLength) {
                handleRaceFinish();
            }
        }

        function handleRaceFinish() {
            clearInterval(gameTicker);
            gameTicker = null;
            switchScreen('screen-results');

            let standings = [{ name: 'Ты', score: playerDistance, isPlayer: true }];
            competitors.forEach(b => standings.push({ name: `P_${b.id}`, score: b.distance }));
            standings.sort((a,b) => b.score - a.score);
            
            let rank = standings.findIndex(x => x.isPlayer) + 1;
            document.getElementById('res-rank').innerText = `${rank} МЕСТО`;
            
            // Расчет наградной экономики монет
            let coinsEarned = 0;
            if(rank === 1) coinsEarned = 50;
            else if(rank === 2) coinsEarned = 30;
            else if(rank === 3) coinsEarned = 15;
            else coinsEarned = 5;

            updateCoins(coinsEarned);

            document.getElementById('res-reward').innerText = `+${coinsEarned} 💰 монеток`;
            document.getElementById('res-desc').innerText = `Заезд на локации ${currentTrack.name} завершен! Боты ехали на пределе возможностей.`;
        }
    </script>
</body>
</html>
